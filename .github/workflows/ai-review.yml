name: Revisão por IA

# Revisão automática de PR com o Claude. Comenta problemas inline e deixa um
# resumo no PR. Não aprova nem bloqueia: a decisão continua sendo humana.
#
# Configuração (uma vez): Settings → Secrets and variables → Actions →
# New repository secret → ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # PR de fork não recebe secrets; rascunhos não são revisados.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você está revisando um PR do portfólio pessoal (Vue 3 + TypeScript + Vite),
            publicado no GitHub Pages. Leia o CLAUDE.md antes de revisar.

            Foque, nesta ordem:
            1. Conteúdo: texto em PT e EN equivalentes, sem erro de português/inglês,
               sem informação inventada sobre a carreira.
            2. Acessibilidade: contraste, textos alternativos, foco visível, semântica.
            3. Responsividade: layout em 360px, 768px e desktop.
            4. Qualidade Vue/TS: reatividade correta, tipos, componentes coesos.
            5. Performance: tamanho de imagem e de bundle.

            Regras:
            - Comente só o que for relevante; não comente estilo de formatação.
            - Cada comentário inline explica o problema e sugere a correção.
            - Termine com um comentário de resumo.
            - Escreva em português.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
