!function(){"use strict";var e={266:function(e,t,n){var r=n(164);function a(e,t){(null==t||t>e.length)&&(t=e.length);for(var n=0,r=new Array(t);n<t;n++)r[n]=e[n];return r}function l(e,t){return function(e){if(Array.isArray(e))return e}(e)||function(e,t){var n=null==e?null:"undefined"!==typeof Symbol&&e[Symbol.iterator]||e["@@iterator"];if(null!=n){var r,a,l=[],o=!0,i=!1;try{for(n=n.call(e);!(o=(r=n.next()).done)&&(l.push(r.value),!t||l.length!==t);o=!0);}catch(c){i=!0,a=c}finally{try{o||null==n.return||n.return()}finally{if(i)throw a}}return l}}(e,t)||function(e,t){if(e){if("string"===typeof e)return a(e,t);var n=Object.prototype.toString.call(e).slice(8,-1);return"Object"===n&&e.constructor&&(n=e.constructor.name),"Map"===n||"Set"===n?Array.from(e):"Arguments"===n||/^(?:Ui|I)nt(?:8|16|32)(?:Clamped)?Array$/.test(n)?a(e,t):void 0}}(e,t)||function(){throw new TypeError("Invalid attempt to destructure non-iterable instance.\nIn order to be iterable, non-array objects must have a [Symbol.iterator]() method.")}()}var o=n(791),i=JSON.parse('{"en":["Develop enterprise software for Grupo Mysa, contributing to a nationwide e-commerce platform and ERP workflows used in commercial operations and branch management. Work across requirements analysis, implementation, testing, code review, deployment, and production support, collaborating with stakeholders to turn business needs and interface designs into working features.\\n\\n\\nMaintain and modernize PHP/Laravel applications by investigating defects, tracing business rules, and improving existing services. Build REST APIs and integrations connecting ERP, Salesforce, e-commerce, and internal systems, handling data synchronization, validation, integration failures, and inconsistent records. Develop frontend features with React, Vue, JavaScript, and TypeScript, using npm and Yarn; use Composer, Artisan, and Eloquent ORM in Laravel development.\\n\\n\\nImplement Salesforce Lightning Web Components and business automation with Apex, Triggers, and Flows, alongside Aura, Visualforce, and SOQL/SOSL. Investigate production incidents across application and integration boundaries, deliver corrective and evolutionary changes, and participate in releases in an AWS environment. These contributions support the continued operation and evolution of connected enterprise systems and customer-facing commerce workflows.","Developed and maintained enterprise applications with Oracle APEX and Oracle Database for industrial operations, mining, and agribusiness. Contributed to solutions used by Albras, Ra\xedzen, Tereos, FS Bioenergia, Keune, and Vale, supporting auditing, operational management, risk analysis, and data collection. Translated operational requirements into application features and database logic within existing enterprise systems.\\n\\n\\nImplemented data-entry forms, field validations, business rules, stored procedures, and database triggers with PL/SQL. Wrote SQL and PL/SQL queries for application functionality, operational reports, and document generation, connecting collected information to the processes followed by business users. Developed and maintained REST API integrations so applications could exchange information with other enterprise systems.\\n\\n\\nInvestigated incidents in existing applications, traced issues through database queries and business logic, and delivered corrective maintenance and functional enhancements. Worked with Git to manage code changes while evolving Oracle APEX applications and their database components. The work made operational information available through structured forms, reports, documents, and integrations, supporting the daily execution of audit and management workflows across different client environments.","Developed and enhanced a legacy PHP application used to automate operational processes, working within an established Model-View-Controller (MVC) architecture. Focused on extending the existing system through application features and business rules, connecting the needs of operational workflows to changes in the codebase rather than replacing the application or introducing an unrelated architecture.\\n\\n\\nImplemented functionality across the existing MVC structure, working with application logic and MySQL persistence. Wrote and maintained SQL queries used by application features, connected business rules to stored data, and adapted existing functionality to the processes being automated. The role required understanding how the legacy codebase organized its responsibilities so that new changes could fit the application structure and existing workflows.\\n\\n\\nUsed Git to version development and maintenance changes, keeping modifications within the established project structure. Contributed to the continued evolution of the operational system through hands-on PHP development, MVC-based implementation, MySQL data handling, and SQL queries. The resulting features expanded the processes supported by the application and allowed operational requirements to be addressed within the existing software, preserving continuity for the workflows already handled by the system.","Developed and supported enterprise applications for financial cooperatives at Sicoob Central Cecremge, contributing to backend services, web interfaces, integrations, and production maintenance. Built PHP/Laravel REST APIs connecting web applications and internal services, using Composer, Artisan, and Eloquent ORM. Implemented React/TypeScript and Vue interfaces and worked with C#/.NET, Node.js, and Python in enterprise solutions.\\n\\n\\nWorked in a Microsoft Azure environment with SQL Server and MySQL, writing queries and maintaining application data access and business functionality. Modernized legacy PHP/Laravel and JavaScript systems through refactoring, corrective maintenance, and functional enhancements. Investigated production incidents, traced defects through existing code and integrations, and delivered hotfixes for issues affecting business applications.\\n\\n\\nApplied SOLID principles and automated unit testing with Jest and PHPUnit to support maintainable application changes. Used GitLab CI/CD, Docker, and Linux in delivery and production support, alongside Zeev BPMS in the enterprise environment. Contributed across implementation, testing, deployment, and incident resolution, supporting the continued operation of financial systems while evolving their interfaces, APIs, and integration capabilities.","Supported Salesforce CRM implementation and adoption for real estate commercial operations at Construtora Voc\xea, connecting system functionality to the workflows followed by sales and operational teams. Gathered user requirements, documented business processes, and contributed to commercial workflow improvements so employees could incorporate the CRM into their daily activities and handle operational information within the system.\\n\\n\\nProvided user support and training, explained application functionality, and helped resolve system issues reported by employees. Worked with business teams to understand practical process needs and translate day-to-day difficulties into documented requirements and workflow improvements. This combined systems analysis, process documentation, and direct support for employees using the commercial applications.\\n\\n\\nReviewed and validated financial information and documentation associated with mortgage credit processes, coordinating with commercial and operational teams involved in those workflows. Used Salesforce CRM, Fluig, TOTVS, and PVI in the business environment. The role supported the consolidation of CRM processes, the adoption of enterprise tools by users, and the handling of documentation required for mortgage credit operations, bringing together application support, business process analysis, employee training, and financial data validation."],"pt":["Desenvolvo software corporativo no Grupo Mysa, contribuindo para uma plataforma nacional de e-commerce e fluxos de ERP utilizados nas opera\xe7\xf5es comerciais e na gest\xe3o de filiais. Atuo na an\xe1lise de requisitos, implementa\xe7\xe3o, testes, revis\xe3o de c\xf3digo, implanta\xe7\xe3o e sustenta\xe7\xe3o, em colabora\xe7\xe3o com as \xe1reas de neg\xf3cio para transformar necessidades e prot\xf3tipos em funcionalidades.\\n\\nRealizo manuten\xe7\xe3o e moderniza\xe7\xe3o de aplica\xe7\xf5es PHP/Laravel, investigando falhas, analisando regras de neg\xf3cio e evoluindo servi\xe7os existentes. Desenvolvo APIs REST e integra\xe7\xf5es entre ERP, Salesforce, e-commerce e sistemas internos, com sincroniza\xe7\xe3o e valida\xe7\xe3o de dados, tratamento de falhas e diagn\xf3stico de inconsist\xeancias. Implemento interfaces com React, Vue, JavaScript e TypeScript, utilizando npm e Yarn; no Laravel, trabalho com Composer, Artisan e Eloquent ORM.\\n\\nDesenvolvo componentes Salesforce LWC e automa\xe7\xf5es com Apex, Triggers e Flows, al\xe9m de atuar com Aura, Visualforce e SOQL/SOSL. Investigo incidentes entre aplica\xe7\xf5es e integra\xe7\xf5es, entrego melhorias e corre\xe7\xf5es e participo de releases em ambiente AWS. Essas entregas sustentam a opera\xe7\xe3o e a evolu\xe7\xe3o dos sistemas corporativos integrados e dos processos de com\xe9rcio digital.","Desenvolvi e mantive aplica\xe7\xf5es corporativas com Oracle APEX e Oracle Database para opera\xe7\xf5es industriais, minera\xe7\xe3o e agroneg\xf3cio. Contribu\xed para solu\xe7\xf5es utilizadas por Albras, Ra\xedzen, Tereos, FS Bioenergia, Keune e Vale, apoiando auditoria, gest\xe3o operacional, an\xe1lise de riscos e coleta de dados. Traduzi requisitos operacionais em funcionalidades e regras de banco de dados nos sistemas existentes.\\n\\nImplementei formul\xe1rios, valida\xe7\xf5es de campos, regras de neg\xf3cio, procedures e triggers com PL/SQL. Desenvolvi consultas SQL e PL/SQL para funcionalidades, relat\xf3rios e emiss\xe3o de documentos operacionais, conectando as informa\xe7\xf5es coletadas aos processos dos usu\xe1rios. Desenvolvi e mantive integra\xe7\xf5es por APIs REST para troca de informa\xe7\xf5es entre aplica\xe7\xf5es e outros sistemas corporativos.\\n\\nInvestiguei incidentes nas aplica\xe7\xf5es, analisei consultas e regras de neg\xf3cio e entreguei manuten\xe7\xe3o corretiva e evolu\xe7\xe3o funcional. Utilizei Git no versionamento das altera\xe7\xf5es em Oracle APEX e componentes de banco. O trabalho disponibilizou informa\xe7\xf5es operacionais por meio de formul\xe1rios estruturados, relat\xf3rios, documentos e integra\xe7\xf5es, apoiando os fluxos di\xe1rios de auditoria e gest\xe3o em diferentes clientes.","Desenvolvi e evolu\xed uma aplica\xe7\xe3o legada em PHP voltada \xe0 automa\xe7\xe3o de processos operacionais, seguindo a arquitetura Model-View-Controller (MVC). Atuei na amplia\xe7\xe3o do sistema existente por meio de funcionalidades e regras de neg\xf3cio, traduzindo as necessidades dos fluxos operacionais em altera\xe7\xf5es no c\xf3digo.\\n\\nImplementei funcionalidades na estrutura MVC existente, trabalhando com l\xf3gica de aplica\xe7\xe3o e persist\xeancia em MySQL. Desenvolvi e mantive consultas SQL utilizadas pelas funcionalidades, conectei regras de neg\xf3cio aos dados armazenados e adaptei recursos aos processos automatizados. Analisei a organiza\xe7\xe3o do legado para integrar as altera\xe7\xf5es \xe0 arquitetura e aos fluxos j\xe1 existentes.\\n\\nUtilizei Git no versionamento das mudan\xe7as de desenvolvimento e manuten\xe7\xe3o. Contribu\xed para a evolu\xe7\xe3o do sistema operacional com PHP, arquitetura MVC, MySQL e consultas SQL. As funcionalidades ampliaram os processos atendidos pela aplica\xe7\xe3o e permitiram incorporar requisitos operacionais ao software existente, preservando a continuidade dos fluxos j\xe1 suportados pelo sistema.","Desenvolvi e sustentei aplica\xe7\xf5es corporativas para cooperativas financeiras no Sicoob Central Cecremge, atuando em servi\xe7os backend, interfaces web, integra\xe7\xf5es e manuten\xe7\xe3o em produ\xe7\xe3o. Desenvolvi APIs REST em PHP/Laravel para integra\xe7\xe3o entre aplica\xe7\xf5es web e servi\xe7os internos, utilizando Composer, Artisan e Eloquent ORM. Implementei interfaces com React/TypeScript e Vue e atuei com C#/.NET, Node.js e Python em solu\xe7\xf5es corporativas.\\n\\nTrabalhei em ambiente Microsoft Azure com SQL Server e MySQL, desenvolvendo consultas e mantendo o acesso a dados e as funcionalidades de neg\xf3cio. Modernizei sistemas legados PHP/Laravel e JavaScript por meio de refatora\xe7\xe3o, manuten\xe7\xe3o corretiva e melhorias. Investiguei incidentes em produ\xe7\xe3o, rastreei falhas no c\xf3digo e nas integra\xe7\xf5es e entreguei hotfixes em aplica\xe7\xf5es de neg\xf3cio.\\n\\nApliquei SOLID e testes unit\xe1rios automatizados com Jest e PHPUnit para apoiar a manuten\xe7\xe3o do software. Utilizei GitLab CI/CD, Docker e Linux nas entregas e na sustenta\xe7\xe3o, al\xe9m de Zeev BPMS no ambiente corporativo. Participei da implementa\xe7\xe3o, testes, implanta\xe7\xe3o e resolu\xe7\xe3o de incidentes, apoiando a continuidade dos sistemas financeiros e a evolu\xe7\xe3o de interfaces, APIs e integra\xe7\xf5es.","Apoiei a implanta\xe7\xe3o e ado\xe7\xe3o do Salesforce CRM nas opera\xe7\xf5es comerciais imobili\xe1rias da Construtora Voc\xea, conectando as funcionalidades aos fluxos das equipes comerciais e operacionais. Levantei requisitos com usu\xe1rios, documentei processos e contribu\xed para melhorias nos fluxos comerciais, apoiando o uso di\xe1rio do CRM e o tratamento de informa\xe7\xf5es operacionais.\\n\\nPrestei suporte e treinamento aos usu\xe1rios, esclareci funcionalidades e ajudei a resolver problemas reportados pelos colaboradores. Trabalhei com as \xe1reas de neg\xf3cio para compreender necessidades e transformar dificuldades do dia a dia em requisitos documentados e melhorias de processos. A atua\xe7\xe3o combinou an\xe1lise de sistemas, documenta\xe7\xe3o e suporte direto \xe0s equipes.\\n\\nAnalisei e validei informa\xe7\xf5es financeiras e documentos relacionados a processos de cr\xe9dito imobili\xe1rio, em conjunto com as \xe1reas comerciais e operacionais. Utilizei Salesforce CRM, Fluig, TOTVS e PVI no ambiente de neg\xf3cio. O trabalho apoiou a consolida\xe7\xe3o dos processos de CRM, a ado\xe7\xe3o de ferramentas corporativas e o tratamento da documenta\xe7\xe3o necess\xe1ria ao cr\xe9dito imobili\xe1rio, reunindo suporte a aplica\xe7\xf5es, an\xe1lise de processos, treinamento e valida\xe7\xe3o de dados financeiros."]}'),c={pt:"data:application/pdf;base64,JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiswIDggMCBSIC9GMyswIDEyIDAgUgo+PgplbmRvYmoKMiAwIG9iago8PAovQmFzZUZvbnQgL0hlbHZldGljYSAvRW5jb2RpbmcgL1dpbkFuc2lFbmNvZGluZyAvTmFtZSAvRjEgL1N1YnR5cGUgL1R5cGUxIC9UeXBlIC9Gb250Cj4+CmVuZG9iagozIDAgb2JqCjw8Ci9Db250ZW50cyAxNiAwIFIgL01lZGlhQm94IFsgMCAwIDU5NS4yNzU2IDg0MS44ODk4IF0gL1BhcmVudCAxNSAwIFIgL1Jlc291cmNlcyA8PAovRm9udCAxIDAgUiAvUHJvY1NldCBbIC9QREYgL1RleHQgL0ltYWdlQiAvSW1hZ2VDIC9JbWFnZUkgXQo+PiAvUm90YXRlIDAgL1RyYW5zIDw8Cgo+PiAKICAvVHlwZSAvUGFnZQo+PgplbmRvYmoKNCAwIG9iago8PAovQ29udGVudHMgMTcgMCBSIC9NZWRpYUJveCBbIDAgMCA1OTUuMjc1NiA4NDEuODg5OCBdIC9QYXJlbnQgMTUgMCBSIC9SZXNvdXJjZXMgPDwKL0ZvbnQgMSAwIFIgL1Byb2NTZXQgWyAvUERGIC9UZXh0IC9JbWFnZUIgL0ltYWdlQyAvSW1hZ2VJIF0KPj4gL1JvdGF0ZSAwIC9UcmFucyA8PAoKPj4gCiAgL1R5cGUgL1BhZ2UKPj4KZW5kb2JqCjUgMCBvYmoKPDwKL0ZpbHRlciBbIC9GbGF0ZURlY29kZSBdIC9MZW5ndGggNjk2Cj4+CnN0cmVhbQp4nG3VzW7aQBSG4T1X4WWrLsBz/hIJIdGQSFn0R6XqnsCQUhWDDCxy953PH0pGbZFgXsY2PLIXZ3z3uHjsdudm/LU/rJf53Gx33abPp8OlX+fmKT/vulGbms1ufb5+Gz7X+9VxNC4XL19O57x/7LaH0XTajL+Vg6dz/9K8mw+vD4v8a/Xjslx1p/ej8Zd+k/td9/z/o8vL8fg773N3biaj2azZ5G35i0+r4+fVPjfjfy55O+H7yzE3afjeUrk+bPLpuFrnftU959F0Mpk103iYjXK3+etYm254zdN2/XPVX8+dlNesdDv0faDT0A+GFu7P0cr9oY37gnbuDx3cb9E37OH3b9m36Dl7gf5YGe6qXlR9X/XDW7eVv22rTlVL1Vq1Ve1VR9U3Vd9WPa+68reVv638beVvK3+iPw1Nf8J9S/SXpTT9Cfc20V+W0vQnPKNEf1lK05/wHBP9ZSlNf8L9T/QnPMdEf1lK01+W0vQnPKNEf
